<body>
    <header>
        <div class="header-topbar">
            <div class="lang-switch">
                <label><input type="radio" name="lang" value="ja" checked> JP</label>
                <label><input type="radio" name="lang" value="en"> EN</label>
            </div>
        </div>
        <h1 data-i18n="pageTitle">うーこポイント交換所</h1>
        <p class="header-sub" data-i18n="headerSub">貯まったうーこポイント(UP)で、色々なサイトのちょっとした特典と交換できます</p>
    </header>

    <main>
        <section class="balance-section">
            <p class="balance-label" data-i18n="balanceLabel">現在の所持UP</p>
            <p class="balance-value"><span id="balance-count">0</span><span class="balance-unit">UP</span></p>
            <p class="balance-hint" data-i18n="balanceHint">UPは原神おみくじの「アゲいいね！」「モラいいね！」で貯まります</p>
        </section>

        <section class="items-section">
            <h2 data-i18n="itemsTitle">交換できる特典</h2>
            <div class="item-list" id="item-list"></div>
        </section>
    </main>

    <div class="toast" id="toast" style="display:none;"></div>

    <a href="https://x.com/uko_dayo_" target="_blank" rel="noopener">

    <span id="uko-account-status-slot"></span>

    <span id="site-version" class="site-version">v1.0</span>
